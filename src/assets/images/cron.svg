<?xml version="1.0" encoding="utf-8"?>
<svg viewBox="0 0 280 280" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Safe cron scheduler icon">
  <!-- Clock face -->
  <circle cx="140" cy="148" r="104" fill="#000000"/>

  <!-- Top mounting nub -->
  <rect x="124" y="18" width="32" height="26" rx="8" fill="#000000"/>

  <!-- Hour markers -->
  <g fill="#ffffff">
    <rect x="133" y="58" width="14" height="22" rx="7"/>
    <rect x="133" y="216" width="14" height="22" rx="7"/>
    <rect x="50" y="141" width="22" height="14" rx="7"/>
    <rect x="208" y="141" width="22" height="14" rx="7"/>
  </g>

  <!-- Clock hands -->
  <line x1="140" y1="148" x2="140" y2="92"
        stroke="#ffffff" stroke-width="16" stroke-linecap="round"/>
  <line x1="140" y1="148" x2="186" y2="170"
        stroke="#ffffff" stroke-width="16" stroke-linecap="round"/>

  <!-- Center pin -->
  <circle cx="140" cy="148" r="11" fill="#ffffff"/>
</svg>