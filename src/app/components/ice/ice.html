<div class="white-bg">
  <form>
    <div class="flex-c h-center h-spaced lv-spaced strong v-padding">
      <label class="width-limit">
        <span>Opacity: {{ opacity() | number:"1.2-2" }}</span>
        <input type="range" min="0" max="1" step="0.01"
               [ngModel]="opacity()" name="opacity"
               (ngModelChange)="onOpacityChange($event)" />
      </label>
      <label class="width-limit">
        <span>Base transmission: {{ transmission() | number:"1.2-2" }}</span>
        <input type="range" min="0" max="1" step="0.01"
               [ngModel]="transmission()" name="transmission"
               (ngModelChange)="onTransmissionChange($event)" />
      </label>
      <label class="width-limit">
        <span>Thickness: {{ thickness() | number:"1.1-1" }}</span>
        <input type="range" min="0.1" max="4" step="0.1"
               [ngModel]="thickness()" name="thickness"
               (ngModelChange)="onThicknessChange($event)" />
      </label>
      <label class="width-limit">
        <span>Frost (roughness): {{ roughness() | number:"1.2-2" }}</span>
        <input type="range" min="0" max="1" step="0.01"
               [ngModel]="roughness()" name="roughness"
               (ngModelChange)="onRoughnessChange($event)" />
      </label>
      <label class="width-limit">
        <span>Metalness: {{ metalness() | number:"1.2-2" }}</span>
        <input type="range" min="0" max="1" step="0.01"
               [ngModel]="metalness()" name="metalness"
               (ngModelChange)="onMetalnessChange($event)" />
      </label>
      <label class="width-limit">
        <span>IOR: {{ ior() | number:"1.2-2" }}</span>
        <input type="range" min="1" max="2.5" step="0.01"
               [ngModel]="ior()" name="ior"
               (ngModelChange)="onIorChange($event)" />
      </label>
      <label class="width-limit">
        <span>Specular intensity: {{ specularIntensity() | number:"1.2-2" }}</span>
        <input type="range" min="0" max="1" step="0.01"
               [ngModel]="specularIntensity()" name="specularIntensity"
               (ngModelChange)="onSpecularIntensityChange($event)" />
      </label>
      <label class="width-limit">
        <span>Tint:</span>
        <input type="color"
               [ngModel]="tint()" name="tint"
               (ngModelChange)="onTintChange($event)" />
      </label>
      <label class="width-limit">
        <span>Specular color:</span>
        <input type="color"
               [ngModel]="specularColor()" name="specularColor"
               (ngModelChange)="onSpecularColorChange($event)" />
      </label>
      <div class="width-limit flex-r h-center h-spaced">
        <button type="button" class="btn btn-primary" (click)="toggleAutoRotate()">
          {{ autoRotate() ? "Stop Spin" : "Spin" }}
        </button>
        <button type="button" class="btn btn-primary" (click)="resetView()">Reset View</button>
      </div>
    </div>
  </form>
  <div class="ice-container">
    <canvas #iceCanvas class="ice-canvas"></canvas>
  </div>
</div>
